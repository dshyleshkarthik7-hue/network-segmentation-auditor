[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "network-segmentation-auditor"
version = "2.0.0"
description = "Passive reachability and network-segmentation policy auditor for design review and CI. Models multi-hop paths and blast radius."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Shylesh Karthik Dinavahi" }
]
keywords = [
    "network-security",
    "segmentation",
    "cidr",
    "firewall-policy",
    "zero-trust",
    "defensive-security",
    "blast-radius",
    "reachability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
    "mypy>=1.11",
]

[project.scripts]
network-segmentation-auditor = "seg_audit.cli:main"
nsa = "seg_audit.cli:main"

[project.urls]
Homepage = "https://github.com/dshyleshkarthik7-hue/network-segmentation-auditor"
Documentation = "https://github.com/dshyleshkarthik7-hue/network-segmentation-auditor#readme"
Issues = "https://github.com/dshyleshkarthik7-hue/network-segmentation-auditor/issues"
Changelog = "https://github.com/dshyleshkarthik7-hue/network-segmentation-auditor/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["seg_audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["seg_audit", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
packages = ["seg_audit"]
